[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autoeval-api"
version = "0.1.0"
description = "Versioned LangGraph tracing and evaluation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.15,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/autoeval_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
