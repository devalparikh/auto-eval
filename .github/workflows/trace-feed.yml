name: Trace feed package
on:
  pull_request:
    paths:
      - LICENSE
      - packages/trace-feed/**
      - .github/workflows/trace-feed.yml
      - .github/workflows/sdk-publish.yml
      - scripts/sdk_publish.py
      - scripts/test_sdk_publish.py
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm run test:package
        working-directory: packages/trace-feed
      - run: python3 -m unittest discover -s scripts -p test_sdk_publish.py -v
