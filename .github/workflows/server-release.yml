name: Server release candidate
on:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate version (publication requires separate explicit approval)
        required: true
        default: 0.0.0-candidate
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: autoeval_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTOEVAL_TEST_POSTGRES_URL: postgresql+psycopg://postgres@127.0.0.1:5432/autoeval_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install validation dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -e 'backend[dev,hosted]'
          cd frontend
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Full product verification
        run: make verify
      - name: Build candidate outside the source tree
        env:
          VERSION: ${{ inputs.version || '0.0.0-candidate' }}
        run: python3 scripts/server_release.py build --source . --output "$RUNNER_TEMP/server-release" --version "$VERSION" --source-commit "$GITHUB_SHA"
      - name: Verify installation of candidate
        env:
          VERSION: ${{ inputs.version || '0.0.0-candidate' }}
        run: |
          cd "$RUNNER_TEMP/server-release"
          sha256sum -c SHA256SUMS
          python3 server_release.py install --bundle auto-eval-server.tar.gz --manifest server-manifest.json --manifest-sha256 "$(sha256sum server-manifest.json | cut -d ' ' -f 1)" --destination "$RUNNER_TEMP/server-stage" --version "$VERSION" --source-commit "$GITHUB_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the installed frontend
        working-directory: ${{ runner.temp }}/server-stage/frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Build the installed backend wheel without starting the app
        run: |
          python3 -m venv "$RUNNER_TEMP/installed-backend"
          "$RUNNER_TEMP/installed-backend/bin/pip" install "$RUNNER_TEMP/server-stage/backend[hosted]"
          cd "$RUNNER_TEMP"
          AUTOEVAL_DATABASE_URL="sqlite:///$RUNNER_TEMP/installed.db" "$RUNNER_TEMP/installed-backend/bin/autoeval-migrate" upgrade
          AUTOEVAL_DATABASE_URL="sqlite:///$RUNNER_TEMP/installed.db" "$RUNNER_TEMP/installed-backend/bin/autoeval-migrate" status
          "$RUNNER_TEMP/installed-backend/bin/python" -c 'import jwt; from autoeval_api.app import create_application; assert create_application(initialize_database=False, seed_on_start=False).openapi()'

      # Ephemeral CI evidence, not a registry package or GitHub Release.
      - uses: actions/upload-artifact@v4
        with:
          name: server-release-candidate
          path: ${{ runner.temp }}/server-release/
          retention-days: 7
          if-no-files-found: error
# No tag trigger, contents:write, gh release command, deployment or publication job.
# Publication remains an explicit operator action after approval of exact bytes.
